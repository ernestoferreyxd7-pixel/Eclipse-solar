name: Compilar Eclipse Solar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer ZIP
        run: unzip eclipse-solar-fabric-1.21.1.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar mod
        run: |
          cd eclipse-solar
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: solar-eclipse-jar
          path: eclipse-solar/build/libs/solar-eclipse-1.0.0.jar
